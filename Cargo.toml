[workspace]
resolver = "2"
members = [
    "crates/foco-base",
    "crates/foco-gfx",
    "crates/foco-x11",
    "crates/foco-core",
    "crates/foco-pet",
    "crates/foco-ui",
    "crates/foco-max",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
foco-base = { path = "crates/foco-base" }
foco-gfx = { path = "crates/foco-gfx" }
foco-x11 = { path = "crates/foco-x11" }
foco-core = { path = "crates/foco-core" }
foco-pet = { path = "crates/foco-pet" }
foco-ui = { path = "crates/foco-ui" }

fontconfig = "0.11"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
x11rb = { version = "0.13", features = ["shm", "shape", "randr", "xkb"] }
xkbcommon = { version = "0.9", default-features = false }
rustix = { version = "1", features = ["event", "time", "fs", "process", "net", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dhat = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pixel/geometry math: numeric casts are pervasive and intentional.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Exact float equality is deliberate (anim targets, change detection).
float_cmp = "allow"
# Noise on every getter; not worth ~300 attributes.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# x/y/w/h/r and similar short names are idiomatic in geometry code.
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
# UI state structs are naturally sets of independent flags (hovered, pressed, active, ...).
struct_excessive_bools = "allow"
# Paint/layout/event-dispatch fns are long linear sequences; splitting them hurts readability.
too_many_lines = "allow"
# Restriction lints (not part of pedantic).
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
strip = false
debug = 1
